<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search Videos — HOTVAGE.COM</title>
  <meta name="description" content="Search and discover videos on HOTVAGE.COM.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0b0b0b">

  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      ☰
    </button>

    <a href="../index.html" class="site-logo">
      HOTVAGE.COM
    </a>

    <button class="search-button" id="searchButton" aria-label="Search">
      🔍
    </button>

  </header>


  <!-- NAVIGATION -->
  <nav class="main-nav" id="mainNav">

    <a href="../index.html">TRENDING</a>

    <a href="../categories/index.html">CATEGORIES</a>

    <a href="../videos/most-viewed.html">MOST VIEWED</a>

    <a href="../videos/new.html">NEW VIDEOS</a>

  </nav>


  <!-- MAIN CONTENT -->
  <main class="content-page">

    <section class="page-heading">

      <span class="category-label">
        HOTVAGE.COM
      </span>

      <h1>
        Search Videos
      </h1>

    </section>


    <!-- SEARCH FORM -->
    <section class="search-section">

      <form class="search-form" id="videoSearchForm">

        <label for="searchInput">
          Search for videos
        </label>

        <div class="search-form-row">

          <input
            type="search"
            id="searchInput"
            name="q"
            placeholder="Search videos..."
            autocomplete="off"
            required
          >

          <button type="submit">
            Search
          </button>

        </div>

      </form>

    </section>


    <!-- SEARCH RESULTS -->
    <section class="search-results">

      <div id="searchResultHeading"></div>

      <div class="video-grid" id="searchResultsGrid">

        <article class="video-card">

          <a href="../videos/video.html" class="video-thumbnail">

            <div class="thumbnail-placeholder">

              <div class="placeholder-play">
                ▶
              </div>

            </div>

            <span class="video-quality-badge">
              HD
            </span>

            <span class="video-duration">
              06:24
            </span>

          </a>

          <div class="video-card-content">

            <h2>
              Featured Video
            </h2>

            <div class="video-card-meta">
              <span>24K views</span>
              <span>98% liked</span>
            </div>

          </div>

        </article>

      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="footer-links">

      <a href="about.html">About</a>

      <a href="contact.html">Contact</a>

      <a href="privacy-policy.html">Privacy Policy</a>

      <a href="terms.html">Terms</a>

      <a href="disclaimer.html">Disclaimer</a>

    </div>

    <p>
      © <span id="currentYear"></span> HOTVAGE.COM. All rights reserved.
    </p>

  </footer>


  <script src="../assets/js/script.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const form = document.getElementById("videoSearchForm");
      const input = document.getElementById("searchInput");
      const heading = document.getElementById("searchResultHeading");

      const params = new URLSearchParams(window.location.search);
      const query = params.get("q");

      if (query) {
        input.value = query;

        heading.innerHTML =
          "<h2>Search results for: " +
          escapeHTML(query) +
          "</h2>";
      }

      form.addEventListener("submit", function (event) {

        event.preventDefault();

        const searchTerm = input.value.trim();

        if (!searchTerm) {
          return;
        }

        window.location.href =
          "search.html?q=" +
          encodeURIComponent(searchTerm);

      });

      function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
      }

    });
  </script>

</body>
</html>
